[package]
name = "ddnet-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license-file = "LICENSE"
description = "Incremental Rust port of vanilla DDNet 20.2.1"

[lib]
name = "ddnet_rust"
path = "src/lib.rs"

[[bin]]
name = "ddnet-rust"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
