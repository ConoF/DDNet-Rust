[package]
name = "ddnet-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false
license-file = "LICENSE"
description = "Incremental Rust port of vanilla DDNet 20.2.1"

[features]
default = []
window = ["dep:minifb", "dep:cpal", "dep:font8x8"]

[dependencies]
minifb = { version = "0.29", default-features = false, features = ["x11"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure Rust WavPack decoder; no external C/C++ or FFI.
wavicle = { version = "=0.1.0", default-features = false, features = ["decode"] }
cpal = { version = "=0.16.0", optional = true }
# TLS-only native HTTP browser for the official master list.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
serde_json = "1.0"
font8x8 = { version = "0.3.1", optional = true }

[lib]
name = "ddnet_rust"
path = "src/lib.rs"

[[bin]]
name = "ddnet-rust"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
