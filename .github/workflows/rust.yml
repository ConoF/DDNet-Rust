name: DDNet Rust unit and differential tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --release --locked --features window
      - name: Unit tests and tick simulation
        run: cargo test --all-targets --locked --features window
      - name: Clippy
        run: cargo clippy --all-targets --locked --features window -- -D warnings
      - name: CLI smoke test
        run: cargo run -- --self-test
      - name: Export a synthetic Rust PCM mix to WAV
        run: |
          cargo run --locked -- --audio-smoke target/audio-smoke.wav
          python3 -c "from pathlib import Path; w=Path('target/audio-smoke.wav').read_bytes(); assert w[:4]==b'RIFF' and w[8:12]==b'WAVE' and len(w)==19244"
      - name: Decode original DDNet 20.2.1 WavPack sound effects
        run: |
          cargo run --locked -- --audio-wv-preview upstream/ddnet/data/audio/wp_gun_fire-01.wv target/gun-fire.wav
          cargo run --locked -- --audio-wv-preview upstream/ddnet/data/audio/wp_hammer_swing-01.wv target/hammer-swing.wav
          cargo run --locked -- --audio-wv-preview upstream/ddnet/data/audio/foley_foot_left-01.wv target/player-jump.wav
          python3 -c "import wave; files=['target/gun-fire.wav','target/hammer-swing.wav','target/player-jump.wav']; [(lambda w: (print(f, w.getnframes(), w.getframerate()), (w.getnframes()>100 and w.getnchannels()==2 and w.getframerate()==48000) or (_ for _ in ()).throw(AssertionError(f))))(wave.open(f,'rb')) for f in files]"
      - name: Publish original DDNet decoded WAV effects
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-rust-sound-preview
          path: |
            target/gun-fire.wav
            target/hammer-swing.wav
            target/player-jump.wav
          if-no-files-found: error
      - name: Compare variable integers with unmodified upstream C++
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tools/reference_packer.cpp -o target/reference-packer
          ./target/reference-packer > target/upstream-vectors.txt
          cargo run --quiet -- --codec-vectors > target/rust-vectors.txt
          diff -u target/upstream-vectors.txt target/rust-vectors.txt
      - name: Compare Huffman compression against actual DDNet C++ code
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/reference_shims -Iupstream/ddnet/src \
            tools/reference_huffman.cpp upstream/ddnet/src/engine/shared/huffman.cpp \
            -o target/reference-huffman
          ./target/reference-huffman > target/cpp-huffman-vectors.txt
          cargo run --quiet --locked -- --huffman-vectors > target/rust-huffman-vectors.txt
          diff -u target/cpp-huffman-vectors.txt target/rust-huffman-vectors.txt
      - name: Parse real DDNet 20.2.1 map metadata
        run: |
          cargo run -- --inspect-map upstream/ddnet/data/maps/ctf1.map
          cargo run -- --inspect-map upstream/ddnet/data/maps/coverage.map
          cargo run -- --inspect-map upstream/ddnet/data/maps/Tutorial.map
      - name: Decompress official DDNet map game layers
        run: |
          cargo run -- --inspect-game-map upstream/ddnet/data/maps/ctf1.map
          cargo run -- --inspect-game-map upstream/ddnet/data/maps/coverage.map
          cargo run -- --inspect-game-map upstream/ddnet/data/maps/Tutorial.map
      - name: Render official map collision layer to PPM
        run: |
          cargo run --locked -- --render-debug-map upstream/ddnet/data/maps/ctf1.map target/ctf1-debug.ppm
          test -s target/ctf1-debug.ppm
          test "$(head -c 2 target/ctf1-debug.ppm)" = "P6"
      - name: Export real collision maps to PNG
        run: |
          cargo run --locked -- --render-debug-png upstream/ddnet/data/maps/ctf1.map target/ctf1-debug.png
          cargo run --locked -- --render-debug-png upstream/ddnet/data/maps/Tutorial.map target/tutorial-debug.png
          python3 -c "from pathlib import Path; p=Path('target/ctf1-debug.png'); assert p.read_bytes()[:8] == bytes((137,80,78,71,13,10,26,10))"
      - name: Render original mapres and embedded map textures in Rust
        run: |
          cargo run --locked -- --render-textured-png upstream/ddnet/data/maps/ctf1.map upstream/ddnet/data target/ctf1-textured.png
          python3 -c "from pathlib import Path; p=Path('target/ctf1-textured.png'); assert p.stat().st_size > 200; assert p.read_bytes()[:8] == bytes((137,80,78,71,13,10,26,10))"
      - name: Publish textured visual-layer preview
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-rust-textured-map-preview
          path: target/ctf1-textured.png
          if-no-files-found: error
      - name: Publish diagnostic PNGs
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-rust-collision-preview
          path: |
            target/ctf1-debug.png
            target/tutorial-debug.png
          if-no-files-found: error
      - name: Launch real X11 window and simulate movement under Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          xvfb-run -a cargo run --locked --features window -- --play-offline-smoke upstream/ddnet/data/maps/ctf1.map target/offline-window-smoke.png
          python3 -c "from pathlib import Path; p=Path('target/offline-window-smoke.png'); assert p.stat().st_size > 100; assert p.read_bytes()[:8] == bytes((137,80,78,71,13,10,26,10))"
      - name: Verify offline window skin, weapons and textured map smoke
        run: |
          python3 -c "from pathlib import Path; p=Path('target/offline-window-smoke.png'); assert p.read_bytes()[:8]==bytes((137,80,78,71,13,10,26,10)); assert p.stat().st_size>1000"
      - name: Publish real window smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-rust-window-smoke
          path: target/offline-window-smoke.png
          if-no-files-found: error
      - name: Decode official extra DDNet physics layers
        run: |
          cargo run --locked -- --inspect-layers upstream/ddnet/data/maps/ctf1.map
          cargo run --locked -- --inspect-layers upstream/ddnet/data/maps/coverage.map
          cargo run --locked -- --inspect-layers upstream/ddnet/data/maps/Tutorial.map
          cargo run --locked -- --inspect-layers upstream/ddnet/data/maps/LearnToPlay.map

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --locked --features window
      - run: cargo clippy --all-targets --locked --features window -- -D warnings
      - run: cargo build --release --locked --features window
      - run: cargo run -- --self-test
