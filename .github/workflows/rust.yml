name: DDNet Rust unit and differential tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --release
      - name: Unit tests and tick simulation
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: CLI smoke test
        run: cargo run -- --self-test
      - name: Compare variable integers with unmodified upstream C++
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tools/reference_packer.cpp -o target/reference-packer
          ./target/reference-packer > target/upstream-vectors.txt
          cargo run --quiet -- --codec-vectors > target/rust-vectors.txt
          diff -u target/upstream-vectors.txt target/rust-vectors.txt
      - name: Parse real DDNet 20.2.1 map metadata
        run: |
          cargo run -- --inspect-map upstream/ddnet/data/maps/ctf1.map
          cargo run -- --inspect-map upstream/ddnet/data/maps/coverage.map
          cargo run -- --inspect-map upstream/ddnet/data/maps/Tutorial.map
      - name: Decompress official DDNet map game layers
        run: |
          cargo run -- --inspect-game-map upstream/ddnet/data/maps/ctf1.map
          cargo run -- --inspect-game-map upstream/ddnet/data/maps/coverage.map
          cargo run -- --inspect-game-map upstream/ddnet/data/maps/Tutorial.map
      - name: Emit dependency lockfile for reproducibility
        run: |
          echo 'DDNET_LOCK_BEGIN'
          cat Cargo.lock
          echo 'DDNET_LOCK_END'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: cargo run -- --self-test
