name: GPU Backend / Cargo Lock
on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/gpu_renderer.rs
      - src/gpu_scene.rs
      - src/gpu_hud.rs
      - src/frame_stats.rs
      - src/online_ui.rs
      - src/gpu_tees.rs
      - src/sprite_render.rs
      - src/gpu_shader.wgsl
      - src/ui_font.rs
      - src/gpu_hud.rs
      - src/online_ui.rs
      - src/main.rs
      - src/window_online.rs
      - src/window.rs
      - .github/workflows/gpu-render.yml

jobs:
  gpu:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install graphical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Resolve and check GPU feature
        run: |
          cargo check --all-targets --features gpu
          cargo test --lib --features gpu
      - name: Verify native GPU frame presentation with actual DDNet map
        run: |
          xvfb-run -a cargo run --features gpu -- --gpu-offline-smoke upstream/ddnet/data/maps/ctf1.map
      - name: Commit generated GPU dependency lockfile
        if: always()
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] &&
             ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: lock optional GPU renderer dependencies"
            git push origin HEAD:main
          fi
      - name: Save dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-cargo-lock
          path: Cargo.lock
